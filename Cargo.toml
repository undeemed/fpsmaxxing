[workspace]
resolver = "3"
members = [
  "apps/broker",
  "apps/cli",
  "apps/experiment-runner",
  "apps/gateway",
  "apps/watchdog",
  "crates/contracts",
  "crates/provider-sdk",
  "sidecars/mock-provider",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/undeemed/fpsmaxxing"
rust-version = "1.96"

[workspace.dependencies]
fpsmaxxing-contracts = { path = "crates/contracts" }
fpsmaxxing-provider-sdk = { path = "crates/provider-sdk" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
